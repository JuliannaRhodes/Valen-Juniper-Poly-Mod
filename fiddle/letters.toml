[foraging_with_friends]
	npc = "valen"
	subject_line = "A Foraging Invitation"
	local = """[Ari],

Juniper and I are planning to gather some herbs outside of town for our work, and I thought you might like to join us. I'd appreciate the extra company and help.

It should be a pleasant afternoon provided Juniper doesn't get too carried away, of course.

Meet us near the eastern forest when you have a moment. And perhaps you could help me keep her out of trouble.

See you soon,"""

	quest_to_start = "foraging_with_friends"

    [foraging_with_friends.requirements] 
        completed_quest = ["becoming_junipers_guinea_pig", "the_annual_check_up" ]
        val_juni_lvl = 0
		world_fact_is = { weather = "pleasant"}
		invert.or = [{is_day_type = "saturday"}, {is_festival_day = true}]